<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="mdb.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

    <div class="card" style="width: 18rem;">
  <img src="main17.jpg" class="card-img-top" width="1000px">
  <div class="card-body">
    <h5 class="card-title">Card title</h5>
    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
    <a href="#" class="btn btn-primary">Go somewhere</a>
  </div>
</div>
<button class="btn btn-primary" data-toggle="modal" data-target="#abc">Register</button>
<div class="modal" id="abc">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-secondary">
        <h3>Register here</h3>
        <button class="close" data-dismiss="modal">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body bg-warning">
        <input type="text" class="form-control" placeholder="UserName">
        <input type="password" class="form-control" placeholder="Password"> 
        <input type="text" class="form-control" placeholder="Enter a message">
        <button class="btn btn-primary">Submit</button>
      </div>
    </div>
    
  </div>
</div>
    <script src="jquery.js"></script>
    <script src="popper.js"></script>
    <script src="bootstrap.js"></script>
    <script src="mdb.js"></script>

</body>
</html>
